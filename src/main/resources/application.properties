spring.config.import=optional:file:.env[.properties]

spring.application.name=expensetracker

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Tamil@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.main.allow-circular-references=true

invoice.processing.local-ai.url=${LOCAL_AI_URL:http://localhost:5050/extract-image}
invoice.processing.lm-studio.url=${LM_STUDIO_URL:http://localhost:1234/v1/chat/completions}
invoice.processing.external-fallback.enabled=${EXTERNAL_FALLBACK_ENABLED:true}
invoice.processing.external-fallback.gemini-api-key=${GEMINI_API_KEY:}
invoice.processing.external-fallback.model=${GEMINI_MODEL:gemini-2.5-flash}
invoice.processing.ocr.tesseract-data-path=${TESSERACT_DATA_PATH:}
invoice.processing.ocr.language=${TESSERACT_LANGUAGE:eng}
invoice.processing.ocr.page-seg-mode=${TESSERACT_PAGE_SEG_MODE:1}
invoice.processing.ocr.engine-mode=${TESSERACT_ENGINE_MODE:1}
invoice.processing.ocr.persist-artifacts=${OCR_PERSIST_ARTIFACTS:false}
invoice.processing.storage.upload-path=${EXPENSE_UPLOAD_PATH:${java.io.tmpdir}/expensetracker}
invoice.processing.validation.high-amount-threshold=${VALIDATION_HIGH_AMOUNT_THRESHOLD:100000}
invoice.processing.validation.line-item-tolerance=${VALIDATION_LINE_ITEM_TOLERANCE:2.00}
